numerics:
  primary_route: factor                     # protocol-1 D1, validated in advance
  check_route: gramian
  dtype: float64
  numerical_floor_rel: 1.0e-6

growth_quantity:
  forward: norm2_Phi_tau_plus_H_tau
  backward: norm2_Phi_tau_tau_minus_H
  horizon: 64

h2_1_growth_dominance:
  primary_statistic: kappa_min_of_c_o
  horizon: 64
  k: 16
  top_fraction: 0.10
  min_energy_share: 0.5                     # both kappa_c and kappa_o
  min_spearman_growth: 0.7                  # both rho_c and rho_o
  min_bulk_minus_top_deg: 15.0
  must_exceed_rfull_share: true

h2_2_growth_normalised:
  primary_statistic: theta_stab_growth_normalised
  horizon: 64
  k: 16
  growth_rate: median_log_forward_phi_norm_over_H
  pooling: equal_trace_per_anchor
  max_theta_stab_deg: 30.0
  min_margin_vs_rfull_deg: 15.0
  reported_only: [gap_rule_protocol_1_s7, ablation_discount_only, ablation_equal_energy_only]

h2_3_trajectory_conditioned:
  primary_statistic: contrast_theta_far_minus_theta_near
  horizon: 16
  k: 4
  near_offset: 40                           # > 2H = 32: non-overlapping windows
  far_min_offset: 200
  max_theta_near_deg: 30.0
  min_contrast_deg: 15.0
  min_contrast_margin_vs_rfull_deg: 10.0

controls:
  family: r_full_only
  torch_seeds: [1000, 1001, 1002]           # paired with trained seeds 1/2/3 (C10); humanoid-run uses 1000, 1001

decision:
  min_seeds_per_task: 2
  min_tasks: 4
  per_hypothesis_verdicts: [H2.1, H2.2, H2.3]
  overall_disjunction: false

synthetic_validation:
  cases: [S1_planted_dominance, S2_no_dominance, S3_rotating_subspace, S4_state_independent, S5_overlap_artefact]
